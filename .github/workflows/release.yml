name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  # minimumPackageAge制御はpnpm側で行う
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: 0

permissions: {}

jobs:
  release:
    if: github.repository == 'gahojin/rolldown-gas-plugin'
    timeout-minutes: 10
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    strategy:
      matrix:
        node-version: ['26']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ matrix.node-version }}
          # pnpmキャッシュを使用しない。キャッシュが汚染されるとそれがリリースされる可能性がある
          cache: false
          install: false

      - name: Setup safe-chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        run: pnpm -r stage publish --no-git-checks

      - name: Create GitHub Release
        run: gh release create "$TAG_NAME" --generate-notes --verify-tag
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}