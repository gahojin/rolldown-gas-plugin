packages:
  - .

# 重複排除
dedupePeers: true

catalog:
  rolldown: 1.3.1
  rolldown-plugin-dts: 0.30.1
  typescript: 7.0.2
  vitest: &vitest_ver 5.0.3
  "@biomejs/biome": 2.6.6
  "@fast-check/vitest": 0.5.0
  "@types/node": 26.6.6
  "@vitest/coverage-v8": *vitest_ver

overrides:
  rolldown: "catalog:"

# リリースから一定時間経過していないか、信頼性低下したパッケージはインストールしない
minimumReleaseAge: 2880 # 2d
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

# 特殊なソースからの依存関係をインストールしない
blockExoticSubdeps: true
